{{- if not .Values.secrets.existingSecret }}
{{- /*
Convenience Secret for non-production clusters. Prefer
secrets.existingSecret in production so credentials never pass through
values files or `helm get values`.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "poetry-hummus.secretName" . }}
  labels:
    {{- include "poetry-hummus.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.keys.secretKey }}: {{ required "secrets.values.secretKey is required when secrets.existingSecret is unset" .Values.secrets.values.secretKey | quote }}
  {{ .Values.secrets.keys.databasePassword }}: {{ required "secrets.values.databasePassword is required when secrets.existingSecret is unset" .Values.secrets.values.databasePassword | quote }}
  {{ .Values.secrets.keys.googleClientId }}: {{ .Values.secrets.values.googleClientId | quote }}
  {{ .Values.secrets.keys.googleClientSecret }}: {{ .Values.secrets.values.googleClientSecret | quote }}
  {{ .Values.secrets.keys.adminEmail }}: {{ .Values.secrets.values.adminEmail | quote }}
  {{ .Values.secrets.keys.adminPassword }}: {{ .Values.secrets.values.adminPassword | quote }}
{{- end }}
