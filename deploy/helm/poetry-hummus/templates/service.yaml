apiVersion: v1
kind: Service
metadata:
  name: {{ include "poetry-hummus.fullname" . }}-api
  labels:
    {{- include "poetry-hummus.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.api.type }}
  ports:
    - port: {{ .Values.service.api.port }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: {{ include "poetry-hummus.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "poetry-hummus.fullname" . }}-web
  labels:
    {{- include "poetry-hummus.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.service.web.type }}
  ports:
    - port: {{ .Values.service.web.port }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: {{ include "poetry-hummus.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
