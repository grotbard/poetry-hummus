services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: poet
      POSTGRES_PASSWORD: poet
      POSTGRES_DB: poetry_hummus
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U poet -d poetry_hummus']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://poet:poet@db:5432/poetry_hummus
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - '5173:80'
    depends_on:
      - api

volumes:
  pgdata:
